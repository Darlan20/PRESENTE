name: SupportFlow build

on:
  pull_request:
    paths:
      - "supportflow/**"
      - "render.yaml"
      - ".github/workflows/supportflow-build.yml"
  push:
    branches: [main]
    paths:
      - "supportflow/**"
      - "render.yaml"
      - ".github/workflows/supportflow-build.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supportflow/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: supportflow/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supportflow/Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -DskipTests package
      - run: docker build -t supportflow-backend .
