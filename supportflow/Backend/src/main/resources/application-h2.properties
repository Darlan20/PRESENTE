spring.application.name=Backend

server.port=8080

# H2 (file-based) configuration for local/dev (persiste após reiniciar a aplicação)
spring.datasource.url=jdbc:h2:file:./supportflow-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=${JWT_SECRET:c3VwcG9ydGZsb3ctbG9jYWwtZGV2LWtleS1vbmx5LXJlcGxhY2Utd2l0aC1zZWNyZXQtcHJvZC0wMDEyMzQ1Njc4OTA=}
jwt.refresh-secret=${JWT_REFRESH_SECRET:c3VwcG9ydGZsb3ctbG9jYWwtZGV2LXJlZnJlc2gta2V5LW9ubHktcmVwbGFjZS13aXRoLXNlY3JldC1wcm9kLTAwMTIzNDU2Nzg5MA==}
jwt.expiration=1800000
