# application-prod.properties — Configuração para PRODUÇÃO no Render

spring.application.name=Backend

# Porta (Render injeta automaticamente via PORT)
server.port=${PORT:8080}

# ===== DATASOURCE — PostgreSQL (Render) =====
# Com fallback para H2 se variáveis não forem definidas
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver PostgreSQL — forçado para Render (onde SPRING_DATASOURCE_URL pode ser postgresql://... não JDBC)
# O RenderDatabaseUrlPostProcessor converte postgresql:// em jdbc:postgresql:// antes do datasource iniciar
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Conexão com SSL (obrigatório para Render PostgreSQL)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=300000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Rodar seed demo também em produção (PostgreSQL)
# - idempotente (import.sql usa INSERT ... WHERE NOT EXISTS)
# - executa após o Hibernate criar/atualizar as tabelas
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:import.sql

# Desabilitar H2 console em produção
spring.h2.console.enabled=false

# JWT — Define via variável de ambiente com fallback seguro para evitar falha de boot
# ✅ Access token (30 min): gerenciar dia-a-dia (512-bit for HS512)
jwt.secret=${JWT_SECRET}
# ✅ Refresh token (7 dias): renovar access token (512-bit for HS512)
jwt.refresh-secret=${JWT_REFRESH_SECRET}
# Compatibilidade temporária para aceitar tokens antigos durante a migração de chave.
jwt.legacy-secret=${JWT_LEGACY_SECRET:}
jwt.legacy-refresh-secret=${JWT_LEGACY_REFRESH_SECRET:}
# DEPRECATED: jwt.expiration=86400000 (era 24h, agora 30min de access token)

# CORS — Frontend URL
app.cors.allowed-origins=${FRONTEND_URL}

# Logging
logging.level.root=INFO
logging.level.com.example.Backend=DEBUG

# ===== MAIL (Email) =====
# Configuração de SMTP para produção
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${MAIL_FROM:noreply@supportflow.com}
spring.mail.from-name=${MAIL_FROM_NAME:Support Flow}
