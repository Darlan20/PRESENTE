# application.properties — Configuração principal do Spring Boot.
# Localmente: MySQL. Em produção (Koyeb): PostgreSQL via Neon.
# Driver e dialeto são detectados automaticamente pelo Spring Boot a partir da URL.

spring.application.name=Backend

server.port=${PORT:8080}

# ===== DATASOURCE =====
# Suporta PostgreSQL (produção via Render) e H2 (desenvolvimento)
# Detecta automaticamente pelo prefixo jdbc:postgresql:// ou jdbc:h2://

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./supportflow-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# H2 console (desabilitar em produção se necessário)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== DEV SEED (apenas perfil default/local) =====
# Garante que os usuários demo existam mesmo usando H2 file (ddl-auto=update não executa import.sql automaticamente)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=embedded
spring.sql.init.data-locations=classpath:import.sql

# Hikari connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# JWT — defina JWT_SECRET como variável de ambiente no Render
# ✅ Access token (30 min): gerenciar dia-a-dia
jwt.secret=${JWT_SECRET:c3VwcG9ydGZsb3ctbG9jYWwtZGV2LWtleS1vbmx5LXJlcGxhY2Utd2l0aC1zZWNyZXQtcHJvZC0wMDEyMzQ1Njc4OTA=}
# ✅ Refresh token (7 dias): renovar access token
jwt.refresh-secret=${JWT_REFRESH_SECRET:c3VwcG9ydGZsb3ctbG9jYWwtZGV2LXJlZnJlc2gta2V5LW9ubHktcmVwbGFjZS13aXRoLXNlY3JldC1wcm9kLTAwMTIzNDU2Nzg5MA==}
# Compatibilidade para tokens legados (pode ficar vazio em ambientes sem migração)
jwt.legacy-secret=${JWT_LEGACY_SECRET:}
jwt.legacy-refresh-secret=${JWT_LEGACY_REFRESH_SECRET:}

# ===== MAIL (Email) =====
# Configuração de SMTP para envio de emails
# Usar Gmail, SendGrid, ou outro serviço SMTP configurável por variáveis de ambiente
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${MAIL_FROM:noreply@supportflow.com}
spring.mail.from-name=${MAIL_FROM_NAME:Support Flow}
